[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micromotion"
version = "0.5.0"
description = "Micromotion analysis of motion time series: mocap, IMU and force plate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Alexander Refsum Jensenius", email = "a.r.jensenius@imv.uio.no" }]
keywords = ["micromotion", "standstill", "motion capture", "accelerometer", "quantity of motion"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/fourMs/micromotion"

[tool.hatch.build.targets.wheel]
packages = ["src/micromotion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
